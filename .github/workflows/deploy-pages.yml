name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild monthly so the static demo snapshot stays anchored to "today".
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the browser-only demo
        run: npm run build:demo

      - name: Prepare the Pages artifact
        run: |
          cp dist/mission-grc/browser/index.csr.html dist/mission-grc/browser/index.html
          cp dist/mission-grc/browser/index.csr.html dist/mission-grc/browser/404.html
          touch dist/mission-grc/browser/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/mission-grc/browser

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
